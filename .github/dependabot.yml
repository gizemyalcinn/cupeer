version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 3.x, actor çalıştırma sonucunu dict yerine nesne döndürüyor
      # (src/scraping/apify_client.py'deki run["defaultDatasetId"] kırılır).
      - dependency-name: "apify-client"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
